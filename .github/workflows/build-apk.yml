name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q emberhold.zip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install deps and local Three.js r128
        run: |
          cd emberhold
          npm install
          cp node_modules/three/build/three.min.js www/three.min.js
      - name: Add Android project (landscape both sides, fullscreen)
        run: |
          cd emberhold
          npx cap add android
          sed -i 's/<activity /<activity android:screenOrientation="sensorLandscape" /' android/app/src/main/AndroidManifest.xml
          sed -i '/<style name="AppTheme.NoActionBar"/a \        <item name="android:windowFullscreen">true</item>' android/app/src/main/res/values/styles.xml
          npx cap sync android
      - name: Maven mirror (against 429 from Maven Central)
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/mirror.gradle <<'EOF'
          allprojects {
            buildscript {
              repositories {
                maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
              }
            }
            repositories {
              maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }
            }
          }
          EOF
      - name: Build debug APK (3 attempts)
        run: |
          cd emberhold/android
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Attempt $i failed, retrying in 40s"
            sleep 40
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: emberhold/android/app/build/outputs/apk/debug/app-debug.apk
